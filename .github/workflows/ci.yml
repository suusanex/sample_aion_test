name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet restore AionTest.slnx
      - run: dotnet build AionTest.slnx --no-restore -warnaserror
      - run: dotnet test AionTest.slnx --no-build
      - run: npm ci --prefix tests
      - run: npx --prefix tests playwright install chromium
      - run: npm test --prefix tests
